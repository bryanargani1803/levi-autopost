name: autopost
on:
  schedule:
    - cron: "5 23 * * *"   # 06:05 Jakarta time, every day
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python post.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      - name: Save progress
        if: always()
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add state.json
          git commit -m "progress" || true
          git push
