name: email-flow
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python email_flow.py
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
